[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bearing-kd-onnx"
version = "0.1.0"
description = "Paderborn bearing classification with MOMENT distillation and ONNX inference"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = ["numpy>=1.26,<3", "scipy>=1.11,<2", "onnxruntime>=1.18,<2"]

[project.optional-dependencies]
train = ["torch>=2.6,<3", "momentfm==0.1.4", "peft>=0.18,<0.22", "transformers>=4.44,<5", "huggingface-hub>=0.24,<1", "onnx>=1.16,<2", "onnxscript>=0.3,<1"]
analysis = ["matplotlib>=3.8,<4"]

[project.scripts]
bearing-kd = "bearing_kd.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
# MOMENT 0.1.4's old exact pins conflict with the PEFT/export stack.
# These are the versions used by this project's integration verification.
override-dependencies = ["numpy==2.4.6", "transformers==4.57.6", "huggingface-hub==0.36.2"]
